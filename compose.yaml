name: mojiokoshi

services:
  app:
    build:
      context: .
      # Same image used for dev (hot reload) and prod. The `target` is
      # pinned so compose.override.yaml and a `docker compose build`
      # without override pick up the same stage.
      target: runtime
      cache_from:
        - type=gha
    image: mojiokoshi:local
    ports:
      - "8000:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MOJIOKOSHI_LOG_FORMAT: json
      MOJIOKOSHI_LOG_LEVEL: INFO
      MOJIOKOSHI_OPEN_BROWSER: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Probe the real API path (/api/health) with the venv's Python — there is
      # no curl in the image. urlopen raises on any non-2xx or refused socket,
      # so a wrong path or a down server is reported unhealthy.
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
